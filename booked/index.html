<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Your discovery call is booked</title>
  <style>
    @font-face{font-family:Magiora;src:url('/assets/magiora.ttf') format('truetype');font-display:swap}
    @font-face{font-family:Inter;src:url('/assets/inter.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 24px;background:#ccc2c2 url('/assets/hero-desktop.webp') center/cover no-repeat;color:#3a3a3a;font:18px/1.6 Inter,Arial,sans-serif}
    main{width:min(100%,640px)}
    h1{margin:24px 0;font:400 clamp(48px,8vw,80px)/1.05 Magiora,serif;letter-spacing:-2px}
    p{max-width:530px}
    @media(max-width:767px){body{background-image:url('/assets/hero-mobile.webp')}}
  </style>
</head>
<body>
  <main>
    <h1>Your discovery call is booked.</h1>
    <p>Check your email for your booking confirmation and call details.</p>
    <p>You’ll receive a text 30 minutes before your scheduled call to confirm your attendance.</p>
    <p>Come prepared to discuss your business, your goals, and what you need from your website.</p>
  </main>
</body>
</html>
